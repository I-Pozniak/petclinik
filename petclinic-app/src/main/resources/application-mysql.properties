# database init, supports mysql too
database=mysql
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost/petclinic}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:petclinic}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:petclinic}}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql/schema.sql
spring.sql.init.data-locations=classpath:db/mysql/data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.separator=;
spring.sql.init.encoding=UTF-8
