- name: Ensure baseline packages installed
  become: true
  package:
    name: "{{ baseline_packages }}"
    state: present

- name: Ensure users exist
  become: true
  user:
    name: "{{ item.name }}"
    state: present
  loop: "{{ baseline_users }}"

- name: Add authorized keys
  become: true
  authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ baseline_users | subelements('authorized_keys') }}"
  when: item.1 is defined