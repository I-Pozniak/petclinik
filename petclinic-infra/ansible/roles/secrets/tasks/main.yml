---
- name: Fetch secret from AWS Secrets Manager
  delegate_to: localhost
  become: false
  shell: "aws secretsmanager get-secret-value --secret-id {{ secrets_manager_name }} --region {{ secrets_manager_region }} --query SecretString --output text"
  register: aws_cli_raw
  no_log: true
#  set_fact:
#    secrets_json: "{{ lookup('amazon.aws.secretsmanager_secret', secrets_manager_name, region=secrets_manager_region) | from_json }}"

- name: Set secrets fact
  set_fact:
    secrets_json: "{{ aws_cli_raw.stdout | from_json }}"
  no_log: true

- name: Ensure secret env directory exists
  file:
    path: "{{ secrets_env_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Create env file with secrets
  no_log: false
  copy:
    dest: "{{ secrets_env_file }}"
    owner: ec2-user
    group: ec2-user
    mode: "0600" # Strict permissions: only the owner can read it
    content: |
      # Generated exitby Ansible - Do not edit manually
      {% for env_var, secret_key in secrets_env_mapping.items() %}
      {{ env_var }}="{{ secrets_json[secret_key] }}"
      {% endfor %}

- name: Write .env file
  no_log: false
  copy:
    dest: "{{ secrets_env_file }}"
    mode: '0600'
    content: |
      {% for env_var, secret_key in secrets_env_mapping.items() %}
      {{ env_var }}="{{ secrets_json[secret_key] }}"
      {% endfor %}